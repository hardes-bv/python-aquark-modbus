name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.12"

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/p/aquark-modbus
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python ${{ env.DEFAULT_PYTHON }}
        run: uv python install ${{ env.DEFAULT_PYTHON }}

      - name: Set package version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG}"
          version="${version,,}"
          version="${version#v}"
          # --frozen stamps pyproject.toml without touching uv.lock or
          # syncing a virtual environment, which the build does not need.
          uv version --frozen "${version}"

      - name: Build sdist and wheel
        run: uv build

      - name: Locate built wheel
        run: |
          WHEEL_PATH=$(ls dist/aquark_modbus-*-py3-none-any.whl)
          echo "WHEEL_PATH=${WHEEL_PATH}" >> "${GITHUB_ENV}"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ${{ env.WHEEL_PATH }}
          format: cyclonedx-json
          output-file: aquark-modbus.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM against built artifacts
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
          sbom-path: aquark-modbus.cdx.json

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
